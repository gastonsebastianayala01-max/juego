<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Urban Strike 1.6 Prototype</title><style>html,body{margin:0;overflow:hidden;background:#111;font-family:Arial,sans-serif;touch-action:none}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:1px 1px 3px #000}.top{display:flex;justify-content:space-between;padding:12px;font-weight:bold;font-size:16px}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px}.bottom{position:absolute;left:12px;bottom:12px;font-size:18px}.weapon{position:absolute;right:20px;bottom:14px;font-size:18px;text-align:right}.controls{position:fixed;inset:0;pointer-events:none}.joy{position:absolute;left:18px;bottom:75px;width:120px;height:120px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff12;pointer-events:auto}.knob{position:absolute;width:52px;height:52px;left:34px;top:34px;border-radius:50%;background:#ffffff55}.fire{position:absolute;right:25px;bottom:95px;width:92px;height:92px;border-radius:50%;background:#c22b;display:flex;align-items:center;justify-content:center;font-weight:bold;pointer-events:auto}.reload{position:absolute;right:135px;bottom:45px;width:70px;height:45px;border-radius:12px;background:#333b;display:flex;align-items:center;justify-content:center;pointer-events:auto;font-size:12px}@media(min-width:800px){.controls{display:none}}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><span>ALFA 0</span><span id="round">RONDA 1</span><span id="money">$800</span></div><div class="cross">+</div><div class="bottom">❤ <span id="hp">100</span></div><div class="weapon">RIFLE M4<br><span id="ammo">30 / 90</span></div></div><div class="controls"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="fire" id="fire">DISPARAR</div><div class="reload" id="reload">RECARGAR</div></di
